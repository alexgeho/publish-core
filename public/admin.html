<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Publish Post</title>

  <link rel="stylesheet" href="/css/admin.css">
</head>

<body>

<h1>Content Manager</h1>

<div class="tabs">
  <button class="tab-btn active" data-tab="editor">Editor</button>
  <button class="tab-btn" data-tab="ai">AI Generator</button>
  <button class="tab-btn" data-tab="articles">All Articles</button>
</div>

<!-- EDITOR -->
<div class="tab-content active" id="editor">

  <label>Cover Image (optional)</label>
  <input type="text" id="coverImage">

  <label>Title</label>
  <input type="text" id="title">

  <label>Excerpt</label>
  <input type="text" id="excerpt">

  <label>Date</label>
  <input type="date" id="date">

  <label>Gallery Images (optional, comma separated)</label>
  <input type="text" id="galleryImages">

  <label>Content (HTML)</label>
  <textarea id="content"></textarea>

  <button class="btn btn-primary" id="saveDraftBtn">
    Save Draft
  </button>

  <div id="result"></div>

  <div class="drafts">
    <h2>Drafts</h2>
    <div id="drafts-list">Loading...</div>
  </div>

</div>

<!-- AI -->
<div class="tab-content" id="ai">

  <label>Title</label>
  <input type="text" id="ai-title">

  <label>Approx. characters</label>
  <input type="number" id="ai-length" value="4000">

  <label>Language</label>
  <input type="text" id="ai-language" value="sv">

  <button class="btn btn-primary" id="generateBtn">
    Generate Article
  </button>

</div>

<!-- All Articles -->
 <div class="tab-content" id="articles">
  <h2>All Articles</h2>
  <div id="articles-list">Loading...</div>
</div>
<!-- All Articles end -->

<script src="/js/admin-tabs.js"></script>
<script src="/js/admin-editor.js"></script>
<script src="/js/admin-ai.js"></script>

</body>
</html>
